<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A voice artist in a dubbing booth, seen from behind, voicing a film on screen">
  <!-- A dubbing booth: a voice artist, seen from behind in headphones, speaks into a pop-filtered microphone while the
       film plays on the screen in front of them. Original artwork for Dubloom. -->
  <defs>
    <radialGradient id="room" cx="64%" cy="34%" r="78%">
      <stop offset="0" stop-color="#ffb08a"/>
      <stop offset=".24" stop-color="#ef5f7c"/>
      <stop offset=".52" stop-color="#5b2f73"/>
      <stop offset=".8" stop-color="#1b1836"/>
      <stop offset="1" stop-color="#0c0d18"/>
    </radialGradient>
    <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf9e"/>
      <stop offset=".55" stop-color="#f27a7d"/>
      <stop offset="1" stop-color="#6d3a86"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b8a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd2b0"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16131f"/>
      <stop offset="1" stop-color="#07080e"/>
    </linearGradient>
    <filter id="bokeh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="screen"><rect x="452" y="74" width="300" height="172" rx="10"/></clipPath>
    <style>
      .float { animation: float 9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float.b { animation-duration: 12s; animation-delay: -4s; }
      .playhead { animation: play 6s linear infinite; }
      .played { animation: grow 6s linear infinite; transform-origin: 462px 0; }
      .ring { fill: none; stroke: #ffe1cf; stroke-width: 3; stroke-linecap: round; opacity: 0; animation: ring 2.4s ease-out infinite; }
      .ring.r2 { animation-delay: .8s; } .ring.r3 { animation-delay: 1.6s; }
      .flicker { animation: flicker 5s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-14px, 10px); } }
      @keyframes play { from { transform: translateX(0); } to { transform: translateX(280px); } }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes ring { 0% { opacity: 0; transform: translateX(0); } 20% { opacity: .85; } 100% { opacity: 0; transform: translateX(18px); } }
      @keyframes flicker { 0%, 100% { opacity: .55; } 50% { opacity: .75; } }
      @media (prefers-reduced-motion: reduce) { .float, .playhead, .played, .ring, .flicker { animation: none; } .ring { opacity: .55; } }
    </style>
  </defs>

  <rect width="800" height="500" fill="url(#room)"/>
  <!-- out-of-focus booth lights -->
  <g filter="url(#bokeh)" opacity=".4">
    <circle class="float" cx="120" cy="90" r="46" fill="#5b5bd6"/>
    <circle class="float b" cx="70" cy="300" r="32" fill="#e8456b"/>
    <circle class="float" cx="760" cy="420" r="40" fill="#ff9d5c"/>
  </g>

  <!-- the screen with the film: its light spills onto the artist -->
  <rect class="flicker" x="430" y="56" width="344" height="210" rx="22" fill="#ffb08a" filter="url(#glow)"/>
  <rect x="446" y="68" width="312" height="184" rx="13" fill="#0d0d17"/>
  <g clip-path="url(#screen)">
    <rect x="452" y="74" width="300" height="172" fill="url(#film)"/>
    <circle cx="640" cy="150" r="30" fill="#fff1dc" opacity=".9"/>
    <path d="M452 196 C520 168 560 176 612 192 C660 206 708 182 752 170 L752 246 L452 246 Z" fill="#40244f" opacity=".85"/>
    <path d="M452 220 C540 198 600 214 660 222 C700 228 730 214 752 206 L752 246 L452 246 Z" fill="#241634"/>
    <!-- subtitle lines on the film -->
    <rect x="532" y="214" width="140" height="7" rx="3.5" fill="#fff" opacity=".92"/>
    <rect x="556" y="227" width="92" height="7" rx="3.5" fill="#fff" opacity=".7"/>
  </g>
  <!-- the timeline under the picture, a playhead running through the scene -->
  <rect x="462" y="264" width="280" height="4" rx="2" fill="#ffffff" opacity=".22"/>
  <rect class="played" x="462" y="264" width="280" height="4" rx="2" fill="#ffd2b0"/>
  <circle class="playhead" cx="462" cy="266" r="6.5" fill="#fff"/>

  <!-- the voice artist from behind: light from the screen rims the right edge -->
  <g filter="url(#soft)">
    <ellipse cx="251" cy="236" rx="72" ry="84" fill="url(#rim)"/>
    <path d="M60 500 C72 392 140 336 214 318 L298 318 C374 336 440 392 454 500 Z" fill="url(#rim)"/>
  </g>
  <rect x="216" y="290" width="62" height="58" rx="22" fill="#08080f"/>
  <ellipse cx="246" cy="236" rx="72" ry="84" fill="url(#figure)"/>
  <path d="M54 500 C66 392 134 336 208 318 L292 318 C368 336 434 392 448 500 Z" fill="url(#figure)"/>
  <!-- headphones over the head, a cup on each side -->
  <path d="M172 236 C172 140 320 140 320 236" fill="none" stroke="#0b0b14" stroke-width="12" stroke-linecap="round"/>
  <path d="M190 176 C214 150 280 150 304 176" fill="none" stroke="#ffd2b0" stroke-width="2" stroke-linecap="round" opacity=".55"/>
  <rect x="158" y="214" width="26" height="56" rx="12" fill="#101019"/>
  <rect x="308" y="214" width="26" height="56" rx="12" fill="#101019"/>
  <rect x="330" y="222" width="3" height="40" rx="1.5" fill="#ffd2b0" opacity=".7"/>

  <!-- microphone and pop filter between the artist and the screen -->
  <path d="M432 500 L432 360" stroke="#0d0d17" stroke-width="7" stroke-linecap="round"/>
  <path d="M432 360 L418 304" stroke="#0d0d17" stroke-width="6" stroke-linecap="round"/>
  <g transform="rotate(-16 420 262)">
    <rect x="404" y="222" width="32" height="72" rx="16" fill="#121220"/>
    <rect x="432" y="228" width="3" height="58" rx="1.5" fill="#ffd2b0" opacity=".65"/>
    <g stroke="#2a2a40" stroke-width="2" stroke-linecap="round">
      <line x1="410" y1="238" x2="430" y2="238"/><line x1="410" y1="248" x2="430" y2="248"/><line x1="410" y1="258" x2="430" y2="258"/>
    </g>
  </g>
  <path d="M402 258 L412 262" stroke="#0d0d17" stroke-width="3"/>
  <circle cx="380" cy="252" r="27" fill="#0d0d17" opacity=".5" stroke="#2c2c44" stroke-width="3"/>

  <!-- the voice reaching the microphone -->
  <path class="ring" d="M338 238 q8 14 0 28"/>
  <path class="ring r2" d="M344 228 q13 24 0 48"/>
  <path class="ring r3" d="M350 218 q18 34 0 68"/>
</svg>
